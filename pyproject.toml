[project]
name = "wifi-trancmitor"
version = "0.1.0"
description = "Desktop-controlled file transfers over your local network"
authors = [
    {name = "AlexZha-dev",email = "oleksandr.zhabchenko.work@outlook.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "greenlet (>=3.5.0,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "flet (>=0.86.0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }]
include = [{ path = "assets", format = ["sdist", "wheel"] }]

[tool.flet]
product = "WiFi Transmitter"
icon_background = "#07100C"

[tool.flet.app]
module = "main"
exclude = [".git", ".venv", "venv", ".env", ".data", ".flet-data", ".ruff_cache", "build", "dist", "docs", "tools"]
