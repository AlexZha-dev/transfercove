<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none">
  <title>TransferCove — your files, your network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="400" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07100C"/><stop offset="1" stop-color="#173C27"/>
    </linearGradient>
    <linearGradient id="tile" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#204D32"/><stop offset="1" stop-color="#091B10"/>
    </linearGradient>
    <linearGradient id="signal" x1="18" y1="16" x2="47" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6FFCE"/><stop offset="1" stop-color="#32D878"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#32D878" stop-opacity=".12"/><stop offset="1" stop-color="#32D878" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
    <circle cx="1060" cy="200" r="330" fill="url(#glow)"/>
    <g stroke="#6EF0A0" stroke-opacity=".12">
      <circle cx="1060" cy="200" r="145"/><circle cx="1060" cy="200" r="205"/><circle cx="1060" cy="200" r="265"/>
      <path d="M0 342H1280"/>
    </g>
    <g font-family="Segoe UI,Arial,sans-serif">
      <rect x="54" y="48" width="190" height="30" rx="15" fill="#183C27" stroke="#375A43"/>
      <circle cx="71" cy="63" r="3" fill="#6EF0A0"/>
      <text x="84" y="67" fill="#B6CBBD" font-size="11" font-weight="600" letter-spacing="1.5">LOCAL FILE TRANSFER</text>
      <text x="50" y="155" fill="#F1FBF4" font-size="62" font-weight="700" letter-spacing="-2">Transfer<tspan fill="#6EF0A0">Cove</tspan></text>
      <text x="54" y="214" fill="#F1FBF4" font-size="30" font-weight="500">Your files. Your network.</text>
      <text x="54" y="259" fill="#8DA697" font-size="18">Transfer files between devices over Wi-Fi.</text>
      <text x="54" y="288" fill="#8DA697" font-size="18">Control it from your desktop. Send from a browser.</text>
      <text x="54" y="375" fill="#B6CBBD" font-size="13" letter-spacing="1">PYTHON 3.14+ <tspan fill="#375A43"> / </tspan> FLET <tspan fill="#375A43"> / </tspan> FASTAPI <tspan fill="#375A43"> / </tspan> SQLITE</text>
      <text x="1224" y="375" text-anchor="end" fill="#6EF0A0" font-size="13">v0.2.0</text>
    </g>
    <g transform="translate(964 104) scale(3)">
      <rect x=".75" y=".75" width="62.5" height="62.5" rx="16" fill="url(#tile)" stroke="#3B684A" stroke-width="1.5"/>
      <g stroke="url(#signal)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 23a25.5 25.5 0 0 1 34 0"/><path d="M22 30a15 15 0 0 1 20 0"/><path d="M32 48V36m-6 6 6-6 6 6"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="27.5" stroke="#294C34"/>
</svg>
